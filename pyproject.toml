[project]
name = "eclair"
version = "0.1.0"
description = "ECLAIR Prototype v1 — modular LLM reliability pipeline (Foundation & Shared Contracts)."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100
